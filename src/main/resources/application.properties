spring.application.name=locomotora-backend

server.address=${SERVER_ADDRESS:0.0.0.0}
server.port=${SERVER_PORT:8080}
# gzip para respuestas grandes (catalogo de ejercicios).
server.compression.enabled=true
server.compression.mime-types=application/json
server.compression.min-response-size=2048

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/locomotora}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true

locomotora.jwt.secret=${LOCOMOTORA_JWT_SECRET:change-this-secret-in-production}
locomotora.jwt.expiration-minutes=${LOCOMOTORA_JWT_EXPIRATION_MINUTES:1440}
locomotora.cors.allowed-origin-patterns=${LOCOMOTORA_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*,http://192.168.*:*,http://10.*:*,https://*.ngrok-free.app}

# Agente IA (Fase 5): Qwen 3.8 27B en GroqCloud. Sin clave, el coach responde con reglas locales y
# POST /routines/generate devuelve 503. Variables documentadas en docs/API.md (seccion IA).
locomotora.ai.api-key=${GROQ_API_KEY:}
locomotora.ai.base-url=${LOCOMOTORA_AI_BASE_URL:https://api.groq.com/openai/v1}
locomotora.ai.allowed-models=${LOCOMOTORA_AI_ALLOWED_MODELS:qwen/qwen3.8-27b}
locomotora.ai.coach-model=${LOCOMOTORA_AI_COACH_MODEL:qwen/qwen3.8-27b}
locomotora.ai.routine-model=${LOCOMOTORA_AI_ROUTINE_MODEL:qwen/qwen3.8-27b}
locomotora.ai.coach-reasoning-effort=${LOCOMOTORA_AI_COACH_REASONING_EFFORT:none}
locomotora.ai.routine-reasoning-effort=${LOCOMOTORA_AI_ROUTINE_REASONING_EFFORT:none}
locomotora.ai.coach-max-tokens=${LOCOMOTORA_AI_COACH_MAX_TOKENS:700}
locomotora.ai.routine-max-tokens=${LOCOMOTORA_AI_ROUTINE_MAX_TOKENS:1000}
locomotora.ai.max-tool-rounds=${LOCOMOTORA_AI_MAX_TOOL_ROUNDS:2}
locomotora.ai.chat-token-budget=${LOCOMOTORA_AI_CHAT_TOKEN_BUDGET:7000}
locomotora.ai.daily-coach-messages=${LOCOMOTORA_AI_DAILY_COACH_MESSAGES:30}
locomotora.ai.daily-routine-generations=${LOCOMOTORA_AI_DAILY_ROUTINE_GENERATIONS:5}
locomotora.ai.daily-token-budget=${LOCOMOTORA_AI_DAILY_TOKEN_BUDGET:150000}
locomotora.ai.timeout-seconds=${LOCOMOTORA_AI_TIMEOUT_SECONDS:60}
