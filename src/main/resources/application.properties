spring.application.name=locomotora-backend

server.address=${SERVER_ADDRESS:0.0.0.0}
server.port=${SERVER_PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/locomotora}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true

locomotora.jwt.secret=${LOCOMOTORA_JWT_SECRET:change-this-secret-in-production}
locomotora.jwt.expiration-minutes=${LOCOMOTORA_JWT_EXPIRATION_MINUTES:1440}
locomotora.cors.allowed-origin-patterns=${LOCOMOTORA_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*,http://192.168.*:*,http://10.*:*,https://*.ngrok-free.app}

# Coach IA con Claude (Fase 5). Sin clave, el coach responde con reglas locales y
# POST /routines/generate devuelve 503. Los modelos se eligen por usuario en Perfil.
locomotora.ai.api-key=${ANTHROPIC_API_KEY:}
locomotora.ai.allowed-models=${LOCOMOTORA_AI_ALLOWED_MODELS:claude-haiku-5-5,claude-sonnet-5-5,claude-opus-5-5}
locomotora.ai.coach-model=${LOCOMOTORA_AI_COACH_MODEL:claude-haiku-5-5}
locomotora.ai.routine-model=${LOCOMOTORA_AI_ROUTINE_MODEL:claude-sonnet-5-5}
locomotora.ai.daily-coach-messages=${LOCOMOTORA_AI_DAILY_COACH_MESSAGES:40}
locomotora.ai.daily-routine-generations=${LOCOMOTORA_AI_DAILY_ROUTINE_GENERATIONS:6}
locomotora.ai.timeout-seconds=${LOCOMOTORA_AI_TIMEOUT_SECONDS:120}
locomotora.ai.base-url=${LOCOMOTORA_AI_BASE_URL:}
